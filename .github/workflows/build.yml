name: Build

on:
  push:
    branches: [ master, 'modernize/**', 'feature/v4-hybrid' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InventoryKamera.sln

      - name: Build (Release)
        run: dotnet build InventoryKamera.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/InventoryKamera.Tests/InventoryKamera.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Experimental branch package only; the original alpha/stable builds are untouched.
      - name: Publish V4 preview (self-contained Windows x64)
        if: github.ref == 'refs/heads/feature/v4-hybrid'
        run: dotnet publish InventoryKamera/InventoryKamera.csproj -c Release -r win-x64 --self-contained true --no-restore -o V4_Preview

      - name: Upload V4 preview
        if: github.ref == 'refs/heads/feature/v4-hybrid'
        uses: actions/upload-artifact@v4
        with:
          name: InventoryKamera-V4-Preview-win-x64
          path: V4_Preview/**
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
